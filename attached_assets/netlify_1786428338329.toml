[build]
  publish = "."

[[redirects]]
  from = "/playground"
  to = "/playground.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/genesis-dashboard.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
