<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050816"><link rel="manifest" href="/manifest.webmanifest"><title>OEQL — Buy</title><style>:root{--b:#050816;--c:#0c1627;--l:#263957;--t:#f7faff;--m:#9aacc5;--x:#42e8ff;--v:#a98bff;--g:#45e39b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#173e62,#050816 48%);color:var(--t);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;padding:11px 14px;background:#050816ee;border-bottom:1px solid var(--l);backdrop-filter:blur(12px);display:flex;justify-content:space-between}main{max-width:1100px;margin:auto;padding:10px}.hero,.card{background:#0b1424ed;border:1px solid var(--l);border-radius:18px;padding:15px;margin-bottom:10px}.hero{text-align:center;padding:24px 15px}.ey{color:var(--x);font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{font-size:clamp(38px,8vw,64px);line-height:.9;margin:8px 0}.muted{color:var(--m)}.buybar{display:flex;gap:8px;max-width:650px;margin:15px auto 0}.buybar input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--l);background:#07101d;color:var(--t)}.btn{border:0;border-radius:10px;padding:11px 14px;background:#14223a;color:var(--t);font-weight:850;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(90deg,var(--x),var(--v));color:#031018}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.product{border:1px solid var(--l);border-radius:13px;padding:12px;background:#09111f;min-height:125px;display:flex;flex-direction:column;justify-content:space-between}.product:hover{border-color:var(--x)}.name{font-weight:850}.price{font-size:22px;font-weight:950;margin:5px 0}.tag{font-size:11px;color:var(--g)}.buy{width:100%;margin-top:8px}.status{padding:9px 11px;border-radius:10px;background:#07101b;color:var(--m)}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.buybar{display:grid;grid-template-columns:1fr}.hero{padding:20px 11px}.card{padding:12px}.product{min-height:115px}.btn{width:100%}.buy{width:100%}}</style></head><body><header><b>OEQL</b><span class="muted">Buy · 1 tap</span></header><main><section class="hero"><div class="ey">Public marketplace</div><h1>Buy in 1 tap.</h1><p class="muted">Browse available OEQL products and open checkout directly.</p><div class="buybar"><input id="search" placeholder="Search products…" oninput="render()"><button class="btn primary" onclick="load()">Refresh</button></div></section><section class="card"><div class="ey">Available now</div><div id="status" class="status">Loading buyable catalog…</div></section><section class="card"><div class="grid" id="grid"></div></section></main><script>let items=[];async function load(){status.textContent="Loading buyable catalog…";try{let r=await fetch("/api/buyable");if(!r.ok)throw Error("HTTP "+r.status);let j=await r.json();items=j.items||j.products||j.catalog||[];status.textContent=items.length+" buyable items available";render()}catch(e){status.textContent="Catalog unavailable: "+e}}function render(){let q=(search.value||"").toLowerCase();let a=items.filter(x=>(x.name||x.title||x.id||"").toLowerCase().includes(q));grid.innerHTML=a.map(x=>{let id=x.id||x.product_id;let name=x.name||x.title||id;let price=Number(x.price||0);return "<article class='product'><div><div class='name'>"+esc(name)+"</div><div class='price'>$"+price.toFixed(2)+"</div><div class='tag'>1-tap checkout</div></div><button class='btn primary buy' onclick='buy("+JSON.stringify(id)+")'>Buy now</button></article>"}).join("")||"<div class='muted'>No matching buyable items.</div>"}async function buy(id){let b=document.querySelectorAll(".buy");b.forEach(x=>x.disabled=true);status.textContent="Opening secure checkout…";try{let r=await fetch("/api/buy/"+encodeURIComponent(id),{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});let j=await r.json();if(j.url){location.href=j.url}else if(j.checkout_url){location.href=j.checkout_url}else{status.textContent=j.message||"Checkout response received."}}catch(e){status.textContent="Checkout unavailable: "+e}finally{b.forEach(x=>x.disabled=false)}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}load();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script></body></html>
